<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090d16">
  <title>GITI - Enterprise ERP Admin Dashboard</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- شاشة تسجيل دخول المشرف -->
  <div id="admin-auth-screen" class="login-overlay">
    <div class="login-card">
      <div class="giti-brand-auth">
        <img src="logo.png" alt="GITI Logo" class="giti-logo-auth">
        <h1 class="giti-title-auth">GITI Admin</h1>
        <p class="giti-sub-auth">لوحة تحكم الإدارة العليا والتحكم السحابي</p>
      </div>

      <form id="admin-login-form" class="auth-form" style="margin-top: 20px;">
        <div class="form-group">
          <label>البريد الإلكتروني للإدارة</label>
          <input type="email" id="admin-email" required placeholder="admin@domain.com">
        </div>
        <div class="form-group" style="margin-top: 15px;">
          <label>كلمة المرور</label>
          <input type="password" id="admin-password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn-primary auth-submit-btn" style="margin-top: 20px;">دخول لوحة الإدارة 🔐</button>
      </form>

      <div id="admin-auth-error" class="auth-msg error hidden" style="margin-top: 10px;"></div>
    </div>
  </div>

  <!-- لوحة التحكم الرئيسية للإدارة -->
  <div id="admin-main-app" class="hidden" style="padding: 15px; max-width: 1200px; margin: 0 auto;">
    
    <header class="app-header" style="border-radius: 12px; margin-bottom: 20px; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
      <div class="brand-container" style="display: flex; align-items: center; gap: 12px;">
        <img src="logo.png" alt="GITI Logo" class="giti-header-logo" style="width: 45px; height: 45px; object-fit: contain;">
        <div>
          <h1 style="font-size: 1.2rem; margin: 0;">GITI Enterprise Admin</h1>
          <p class="subtitle" style="margin: 0; font-size: 0.85rem; color: var(--text-muted);">إدارة الرخص، التراخيص، وحسابات المنشآت</p>
        </div>
      </div>
      <div class="header-actions" style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
        <button id="admin-export-json-btn" class="btn-sm" style="background: var(--accent); color: #fff; padding: 8px 12px; font-size: 0.85rem;" title="تصدير نسخة احتياطية لجميع الرخص بصيغة JSON">📥 تصدير رخص JSON</button>
        <a href="index.html" class="btn-icon" title="الذهاب للتطبيق الرئيسي" style="padding: 8px 12px; background: var(--bg-secondary); border-radius: 8px; text-decoration: none;">🏠</a>
        <button id="admin-logout-btn" class="btn-icon btn-logout" title="تسجيل الخروج" style="padding: 8px 12px; background: rgba(239, 68, 68, 0.15); color: var(--danger); border: none; border-radius: 8px; cursor: pointer;">🚪</button>
      </div>
    </header>

    <!-- إحصائيات عامة للنظام -->
    <section class="stats-grid" style="margin-bottom: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px;">
      <div class="stat-card" style="background: var(--bg-secondary); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color);">
        <span class="stat-title" style="font-size: 0.8rem; color: var(--text-muted); display: block;">إجمالي الحسابات</span>
        <strong id="stat-total-users" class="stat-value" style="font-size: 1.5rem; color: var(--text-main);">0</strong>
      </div>
      <div class="stat-card" style="background: var(--bg-secondary); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color);">
        <span class="stat-title" style="font-size: 0.8rem; color: var(--text-muted); display: block;">الحسابات المفعلة</span>
        <strong id="stat-active-users" class="stat-value text-success" style="font-size: 1.5rem;">0</strong>
      </div>
      <div class="stat-card" style="background: var(--bg-secondary); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color);">
        <span class="stat-title" style="font-size: 0.8rem; color: var(--text-muted); display: block;">الحسابات المعطلة</span>
        <strong id="stat-disabled-users" class="stat-value text-danger" style="font-size: 1.5rem;">0</strong>
      </div>
      <div class="stat-card" style="background: var(--bg-secondary); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color);">
        <span class="stat-title" style="font-size: 0.8rem; color: var(--text-muted); display: block;">تحتاج لمتابعة</span>
        <strong id="stat-pending-users" class="stat-value" style="font-size: 1.5rem; color: var(--warning);">0</strong>
      </div>
    </section>

    <!-- أدوات البحث والتصفية الذكية -->
    <section class="card" style="margin-bottom: 20px; padding: 15px; background: var(--bg-secondary); border-radius: 12px; border: 1px solid var(--border-color);">
      <div style="display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between;">
        <div style="flex: 1; min-width: 220px;">
          <input type="text" id="search-admin-users" placeholder="🔍 بحث بالاسم أو البريد الإلكتروني..." style="width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-input); color: var(--text-main); font-size: 0.9rem;">
        </div>
        <div style="display: flex; gap: 6px; align-items: center; flex-wrap: wrap;">
          <button class="filter-chip active" data-filter="all" onclick="window.setAdminFilter('all')" style="padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border-color); cursor: pointer; font-size: 0.85rem; background: var(--accent); color: #fff;">الكل</button>
          <button class="filter-chip" data-filter="active" onclick="window.setAdminFilter('active')" style="padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border-color); cursor: pointer; font-size: 0.85rem; background: var(--bg-input); color: var(--text-main);">🟢 مفعلة</button>
          <button class="filter-chip" data-filter="disabled" onclick="window.setAdminFilter('disabled')" style="padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border-color); cursor: pointer; font-size: 0.85rem; background: var(--bg-input); color: var(--text-main);">🔴 معطلة</button>
          <button class="filter-chip" data-filter="pending" onclick="window.setAdminFilter('pending')" style="padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border-color); cursor: pointer; font-size: 0.85rem; background: var(--bg-input); color: var(--text-main);">🟡 للمتابعة</button>
        </div>
      </div>
    </section>

    <!-- إدارة الحسابات والتراخيص (تصميم بطاقات متجاوبة ومنظمة بدلاً من الجداول المعقدة) -->
    <section class="card" style="background: var(--bg-secondary); border-radius: 12px; border: 1px solid var(--border-color); padding: 15px;">
      <div class="card-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">
        <h3 style="font-size: 1.05rem; margin: 0;">👥 إدارة حسابات المنشآت والنشاطات التجارية</h3>
        <span id="admin-count-display" style="color: var(--text-muted); font-size: 0.85rem;">عرض 0 حساب</span>
      </div>

      <!-- حاوية البطاقات المنظمة -->
      <div id="admin-users-container" style="display: flex; flex-direction: column; gap: 12px; max-height: 520px; overflow-y: auto; padding-left: 4px;">
        <!-- سيتم تعبئة البطاقات برمجياً هنا -->
      </div>
    </section>

  </div>

  <!-- نافذة تعديل بيانات الرخصة والملاحظات -->
  <div id="edit-license-modal" class="login-overlay hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 15px;">
    <div class="login-card" style="background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; width: 100%; max-width: 420px; text-align: right;">
      <h3 style="margin-top: 0; margin-bottom: 15px; font-size: 1.1rem;">✏️ تعديل بيانات الرخصة والاشتراك</h3>
      <form id="edit-license-form">
        <input type="hidden" id="edit-license-id">
        <div class="form-group" style="margin-bottom: 12px;">
          <label style="display: block; margin-bottom: 5px; font-size: 0.85rem;">اسم النشاط التجاري</label>
          <input type="text" id="edit-store-name" required style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-input); color: var(--text-main);">
        </div>
        <div class="form-group" style="margin-bottom: 12px;">
          <label style="display: block; margin-bottom: 5px; font-size: 0.85rem;">تاريخ انتهاء الاشتراك</label>
          <input type="date" id="edit-expiry-date" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-input); color: var(--text-main);">
        </div>
        <div class="form-group" style="margin-bottom: 15px;">
          <label style="display: block; margin-bottom: 5px; font-size: 0.85rem;">ملاحظات إدارية خاصة بالعميل</label>
          <textarea id="edit-admin-notes" rows="3" placeholder="ملاحظات الدعم أو الترتيبات المالية..." style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-input); color: var(--text-main); font-family: inherit;"></textarea>
        </div>
        <div style="display: flex; gap: 10px; justify-content: flex-end;">
          <button type="button" class="btn-sm" style="background: var(--bg-input); color: var(--text-main); padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border-color); cursor: pointer;" onclick="window.closeEditModal()">إلغاء</button>
          <button type="submit" class="btn-sm" style="background: var(--accent); color: #fff; padding: 8px 14px; border-radius: 8px; border: none; cursor: pointer;">حفظ التغييرات</button>
        </div>
      </form>
    </div>
  </div>

  <!-- سكربت الربط مع فايربيس وإدارة لوحة التحكم -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDqFZjs7m93mB5XsnO_bAQV49O7g2FQkZc",
      authDomain: "giti-68750.firebaseapp.com",
      projectId: "giti-68750",
      storageBucket: "giti-68750.firebasestorage.app",
      messagingSenderId: "753885709520",
      appId: "1:753885709520:web:eda57cd4efdb5c4ef48ad5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const authScreen = document.getElementById('admin-auth-screen');
    const mainApp = document.getElementById('admin-main-app');
    const loginForm = document.getElementById('admin-login-form');
    const logoutBtn = document.getElementById('admin-logout-btn');
    const errorDiv = document.getElementById('admin-auth-error');

    let allLicensesData = [];
    let currentFilter = 'all';
    let searchQuery = '';

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        if (user.email === 'haretg@gmail.com') {
          authScreen.classList.add('hidden');
          mainApp.classList.remove('hidden');
          loadSystemUsers();
        } else {
          alert('عذراً، هذا الحساب ليس له صلاحيات المشرف العام!');
          signOut(auth);
        }
      } else {
        authScreen.classList.remove('hidden');
        mainApp.classList.add('hidden');
      }
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('admin-email').value.trim();
      const password = document.getElementById('admin-password').value.trim();
      errorDiv.classList.add('hidden');
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (error) {
        errorDiv.textContent = "خطأ في بيانات الدخول: " + error.message;
        errorDiv.classList.remove('hidden');
      }
    });

    logoutBtn.addEventListener('click', () => {
      signOut(auth);
    });

    async function loadSystemUsers() {
      const container = document.getElementById('admin-users-container');
      container.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-muted);">جاري تحميل البيانات وسحب التراخيص من السحابة...</div>';
      
      try {
        const querySnapshot = await getDocs(collection(db, "licenses"));
        allLicensesData = [];
        
        querySnapshot.forEach((documentSnap) => {
          allLicensesData.push(Object.assign({ id: documentSnap.id }, documentSnap.data()));
        });

        renderFilteredUsers();

      } catch (error) {
        container.innerHTML = `<div style="text-align:center; padding:30px; color:var(--danger);">فشل جلب الحسابات: تأكد من صلاحيات قاعدة البيانات. (${error.message})</div>`;
      }
    }

    window.setAdminFilter = function(filterType) {
      currentFilter = filterType;
      document.querySelectorAll('.filter-chip').forEach(btn => {
        if (btn.dataset.filter === filterType) {
          btn.classList.add('active');
          btn.style.background = 'var(--accent)';
          btn.style.color = '#fff';
        } else {
          btn.classList.remove('active');
          btn.style.background = 'var(--bg-input)';
          btn.style.color = 'var(--text-main)';
        }
      });
      renderFilteredUsers();
    };

    const searchInputEl = document.getElementById('search-admin-users');
    if (searchInputEl) {
      searchInputEl.addEventListener('input', (e) => {
        searchQuery = e.target.value.toLowerCase().trim();
        renderFilteredUsers();
      });
    }

    function renderFilteredUsers() {
      const container = document.getElementById('admin-users-container');
      
      let total = allLicensesData.length;
      let active = 0;
      let disabled = 0;
      let pending = 0;

      const filtered = allLicensesData.filter(data => {
        const isActive = data.isActive === true;
        const isPending = data.isActive === undefined || data.isActive === null;
        
        if (isActive) active++; 
        else if (data.isActive === false) disabled++; 
        else pending++;

        if (currentFilter === 'active' && !isActive) return false;
        if (currentFilter === 'disabled' && data.isActive !== false) return false;
        if (currentFilter === 'pending' && !isPending && isActive) return false;

        if (searchQuery) {
          const store = (data.storeName || '').toLowerCase();
          const email = (data.email || '').toLowerCase();
          if (!store.includes(searchQuery) && !email.includes(searchQuery)) return false;
        }

        return true;
      });

      document.getElementById('stat-total-users').textContent = total;
      document.getElementById('stat-active-users').textContent = active;
      document.getElementById('stat-disabled-users').textContent = disabled;
      document.getElementById('stat-pending-users').textContent = pending;
      
      const countDisplay = document.getElementById('admin-count-display');
      if (countDisplay) countDisplay.textContent = `عرض ${filtered.length} من أصل ${total} حساب`;

      if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-muted);">لا توجد نتائج مطابقة للبحث أو التصفية</div>';
        return;
      }

      container.innerHTML = filtered.map(data => {
        const isActive = data.isActive === true;
        const expiryText = data.expiryDate ? `📅 انتهاء الاشتراك: ${data.expiryDate}` : '📅 تاريخ الانتهاء: غير محدد';
        const notesText = data.adminNotes ? `<div style="color: var(--warning); font-size: 0.8rem; margin-top: 4px;">📌 ملاحظة: ${data.adminNotes}</div>` : '';

        return `
          <div style="background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 8px;">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px;">
              <h4 style="margin: 0; font-size: 1rem; color: var(--text-main); font-weight: 700;">🏢 ${data.storeName || 'غير محدد'}</h4>
              <span style="font-size: 0.8rem; font-weight: 600; padding: 3px 10px; border-radius: 20px; background: rgba(0,0,0,0.25);" class="${isActive ? 'text-success' : 'text-danger'}">
                ${isActive ? '🟢 مفعل' : '🔴 معطل'}
              </span>
            </div>
            
            <div style="font-size: 0.85rem; color: var(--text-muted);">
              📧 ${data.email || 'غير متوفر'}
            </div>

            <div style="font-size: 0.82rem; background: rgba(0,0,0,0.12); padding: 8px 10px; border-radius: 6px; color: var(--text-muted);">
              ${expiryText}
              ${notesText}
            </div>

            <div style="display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.04);">
              <button class="btn-sm ${isActive ? 'btn-secondary' : 'btn-success'}" style="padding: 6px 12px; font-size: 0.8rem; border-radius: 6px; border: none; cursor: pointer;" onclick="window.toggleUserStatus('${data.id}', ${!isActive})">
                ${isActive ? '🔴 تعطيل الحساب' : '🟢 تفعيل الحساب'}
              </button>
              <button class="btn-sm" style="background: var(--warning); color: #fff; padding: 6px 12px; font-size: 0.8rem; border-radius: 6px; border: none; cursor: pointer;" onclick="window.openEditModal('${data.id}', '${(data.storeName || '').replace(/'/g, "\\'")}', '${data.expiryDate || ''}', '${(data.adminNotes || '').replace(/'/g, "\\'")}')">✏️ تعديل</button>
              <button class="btn-sm" style="background: var(--danger); color: #fff; padding: 6px 12px; font-size: 0.8rem; border-radius: 6px; border: none; cursor: pointer;" onclick="window.deleteUserLicense('${data.id}', '${(data.storeName || '').replace(/'/g, "\\'")}')">🗑️ حذف</button>
            </div>
          </div>
        `;
      }).join('');
    }

    window.toggleUserStatus = async function(userId, newStatus) {
      try {
        const userRef = doc(db, "licenses", userId);
        await updateDoc(userRef, { isActive: newStatus });
        alert("✅ تم تحديث حالة الحساب بنجاح سحابياً!");
        loadSystemUsers();
      } catch (err) {
        alert("❌ حدث خطأ أثناء التحديث: " + err.message);
      }
    };

    window.openEditModal = function(id, storeName, expiryDate, adminNotes) {
      document.getElementById('edit-license-id').value = id;
      document.getElementById('edit-store-name').value = storeName;
      document.getElementById('edit-expiry-date').value = expiryDate;
      document.getElementById('edit-admin-notes').value = adminNotes;
      document.getElementById('edit-license-modal').classList.remove('hidden');
    };

    window.closeEditModal = function() {
      document.getElementById('edit-license-modal').classList.add('hidden');
    };

    const editForm = document.getElementById('edit-license-form');
    if (editForm) {
      editForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('edit-license-id').value;
        const storeName = document.getElementById('edit-store-name').value.trim();
        const expiryDate = document.getElementById('edit-expiry-date').value;
        const adminNotes = document.getElementById('edit-admin-notes').value.trim();

        try {
          const userRef = doc(db, "licenses", id);
          await updateDoc(userRef, {
            storeName,
            expiryDate,
            adminNotes
          });
          window.closeEditModal();
          alert('✅ تم تعديل بيانات الرخصة والملاحظات بنجاح!');
          loadSystemUsers();
        } catch (err) {
          alert('❌ فشل حفظ التعديلات: ' + err.message);
        }
      });
    }

    window.deleteUserLicense = async function(userId, storeName) {
      if (!confirm(`⚠️ تحذير نهائي: هل أنت متأكد من حذف رخصة الحساب "${storeName}" نهائياً من قاعدة البيانات؟`)) return;
      try {
        await deleteDoc(doc(db, "licenses", userId));
        alert('🗑️ تم حذف الحساب والرخصة بنجاح.');
        loadSystemUsers();
      } catch (err) {
        alert('❌ فشل حذف الحساب: ' + err.message);
      }
    };

    const exportJsonBtn = document.getElementById('admin-export-json-btn');
    if (exportJsonBtn) {
      exportJsonBtn.addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(allLicensesData, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `giti_licenses_backup_${Date.now()}.json`;
        a.click();
      });
    }
  </script>
</body>
</html>
