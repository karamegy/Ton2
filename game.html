<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مغامرة طرزان والأمازون</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #0b1a12; }
        canvas { display: block; background: linear-gradient(to bottom, #134f2c, #0b1a12); }
        #hud { position: absolute; top: 15px; right: 20px; color: #f39c12; font-size: 1.8em; font-weight: bold; text-shadow: 2px 2px 4px black; }
        #back-btn { position: absolute; top: 15px; left: 20px; background: #27ae60; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 1em; }
    </style>
</head>
<body>
    <div id="hud">النتيجة: 0</div>
    <button id="back-btn" onclick="window.location.href='index.html'">الخروج للرئيسية</button>
    <canvas id="gameCanvas"></canvas>
    <script src="game.js"></script>
</body>
</html>
