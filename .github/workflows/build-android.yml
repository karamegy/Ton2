name: Build GITI ERP Android App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Force Install Android SDK 36 and Build
        run: |
          # 1. تثبيت منصة SDK 36 إجبارياً
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;34.0.0"

          # 2. إعداد مجلد الويب وتحديث ملف التكوين مباشرة
          mkdir -p www
          cp -r * www/ 2>/dev/null || true
          
          node -e '
            const fs = require("fs");
            let cfg = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            cfg.webDir = "www";
            cfg.appId = "io.github.karamegy.Ton2";
            cfg.appName = "Ton2 ERP";
            fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
          '

          # 3. تثبيت أدوات الكاباسيتور الأساسية
          npm install @capacitor/cli @capacitor/core --save-dev

          # 4. إعادة إنشاء منصة أندرويد نظيفة
          rm -rf android
          npx cap add android

          # 5. إنشاء مسار الجافا الصحيح وملف MainActivity
          mkdir -p android/app/src/main/java/io/github/karamegy.Ton2
          cat << 'EOF' > android/app/src/main/java/io/github/karamegy.Ton2/MainActivity.java
          package io.github.karamegy.Ton2;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {}
          EOF

          # 6. تحديث ملف AndroidManifest.xml لإضافة أمر التجاوز الآمن للـ SDK
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />
              <uses-permission android:name="android.permission.USE_FINGERPRINT" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  tools:overrideLibrary="com.getcapacitor.android">

                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:name="io.github.karamegy.Ton2.MainActivity"
                      android:label="@string/title_activity_main"
                      android:theme="@style/AppTheme.NoActionBarLaunch"
                      android:launchMode="singleTask"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="karamegy.github.io" android:pathPrefix="/Ton2" />
                          <data android:scheme="https" android:host="giti-68750.firebaseapp.com" />
                      </intent-filter>
                  </activity>

              </application>

          </manifest>
          EOF

          # 7. نسخ ملف التوقيع الحقيقي
          cp signing.keystore android/app/ || true

          # 8. حقن إعدادات الـ SDK (compileSdk 36 و minSdk 23 و targetSdk 36) وإعدادات التوقيع
          cat << 'EOF' >> android/app/build.gradle

          android {
              compileSdk 36
              defaultConfig {
                  applicationId "io.github.karamegy.Ton2"
                  minSdk 23
                  targetSdk 36
              }
              signingConfigs {
                  release {
                      storeFile file('signing.keystore')
                      storePassword 'Gamef90IIwmB'
                      keyAlias 'my-key-alias'
                      keyPassword 'Gamef90IIwmB'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF

          # 9. مزامنة المشروع وبناء الحزمة مباشرة
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
          ./gradlew assembleDebug --no-daemon

      - name: Upload AAB Bundle Artifact (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: giti-erp-release-bundle
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload APK Artifact (Direct Install)
        uses: actions/upload-artifact@v4
        with:
          name: giti-erp-installable-apk
          path: android/app/build/outputs/apk/debug/*.apk
