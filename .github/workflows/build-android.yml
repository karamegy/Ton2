name: Build GITI ERP Android App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Clean Environment and Generate Android Project
        run: |
          npm install

          # 1. تهيئة مجلد www وتحديث ملف التكوين لتثبيت اسم الحزمة الإجباري io.github.karamegy.Ton2 والـ webDir
          mkdir -p www
          cp -r * www/ 2>/dev/null || true
          
          node -e '
            const fs = require("fs");
            let cfg = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            cfg.webDir = "www";
            cfg.appId = "io.github.karamegy.Ton2";
            cfg.appName = "Ton2 ERP";
            fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
          '

          # 2. مسح مجلد أندرويد لإجبار الكاباسيتور على توليد مشروع جديد ونظيف
          rm -rf android

          # 3. إنشاء منصة أندرويد المربوطة بالحزمة المعتمدة
          npx @capacitor/cli add android
          
          # 4. إنشاء مسار الجافا وملف MainActivity بالمعرف الإجباري الصحيح
          mkdir -p android/app/src/main/java/io/github/karamegy/Ton2
          cat << 'EOF' > android/app/src/main/java/io/github/karamegy/Ton2/MainActivity.java
          package io.github.karamegy.Ton2;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {}
          EOF

          # 5. كتابة ملف AndroidManifest.xml التلقائي المصحح بدقة الموارد والأذونات
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />
              <uses-permission android:name="android.permission.USE_FINGERPRINT"  />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:name="io.github.karamegy.Ton2.MainActivity"
                      android:label="@string/title_activity_main"
                      android:theme="@style/AppTheme.NoActionBarLaunch"
                      android:launchMode="singleTask"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="karamegy.github.io" android:pathPrefix="/Ton2" />
                          <data android:scheme="https" android:host="giti-68750.firebaseapp.com" />
                      </intent-filter>
                  </activity>

              </application>

          </manifest>
          EOF

          # 6. إنشاء مفتاح التوقيع تلقائياً في مجلد أندرويد لكي يتطابق مع البصمة المسجلة دون الحاجة لرفع الملف
          mkdir -p android/app
          keytool -genkey -v -keystore android/app/signing.keystore -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -dname "CN=GITI Admin, OU=Engineering, O=GITI, C=US"

          # 7. إضافة إعدادات التوقيع لقراءة المفتاح المُنشأ مباشرة
          cat << 'EOF' >> android/app/build.gradle

          android {
              signingConfigs {
                  release {
                      storeFile file('signing.keystore')
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }
          EOF

          # 8. مزامنة المشروع
          npx cap sync android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android App (AAB & APK)
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
          ./gradlew assembleDebug

      - name: Upload AAB Bundle Artifact (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: giti-erp-release-bundle
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload APK Artifact (Direct Install)
        uses: actions/upload-artifact@v4
        with:
          name: giti-erp-installable-apk
          path: android/app/build/outputs/apk/debug/*.apk
