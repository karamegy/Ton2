name: Build GITI ERP Android App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android App
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 1. إعداد مجلد الويب لتغذية الكاباسيتور
          mkdir -p www
          cp -r * www/ 2>/dev/null || true
          
          node -e '
            const fs = require("fs");
            if (fs.existsSync("capacitor.config.json")) {
              let cfg = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
              cfg.webDir = "www";
              cfg.appId = "io.github.karamegy.Ton2";
              cfg.appName = "Giti ERP";
              cfg.plugins = cfg.plugins || {};
              cfg.plugins.GoogleAuth = {
                scopes: ["profile", "email"],
                serverClientId: "753885709520-r09nngge8556ndmg0ampdu266iota0lv.apps.googleusercontent.com",
                forceCodeForRefreshToken: true
              };
              fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
            }
          '

          # 2. تثبيت كافة حزم الكاباسيتور والإضافات المستحدثة في app.js
          npm install @capacitor/cli @capacitor/core @capacitor/android @capacitor/app @capacitor/splash-screen @capacitor/filesystem @capacitor/share @codetrix-studio/capacitor-google-auth capacitor-printer @capacitor/assets --save-dev

          # 3. إعادة إنشاء منصة أندرويد
          rm -rf android
          npx cap add android

          # 4. توليد أيقونات التطبيق
          mkdir -p assets
          if [ -f "logo.png" ]; then
            cp logo.png assets/icon-only.png 2>/dev/null || true
            cp logo.png assets/icon.png 2>/dev/null || true
            npx @capacitor/assets generate --android || true
          fi

          # 5. نقل واستدعاء خدمات جوجل إن وجدت
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/
            node -e '
              const fs = require("fs");
              let bg = fs.readFileSync("android/build.gradle", "utf8");
              if (!bg.includes("com.google.gms:google-services")) {
                bg = bg.replace(/dependencies\s*\{/, "dependencies {\n        classpath \"com.google.gms:google-services:4.4.1\"");
                fs.writeFileSync("android/build.gradle", bg);
              }
            '
          fi

          # 6. كتابة ملف AndroidManifest.xml المحدث بالأذونات الكاملة
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools"
              package="io.github.karamegy.Ton2">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />
              <uses-permission android:name="android.permission.USE_FINGERPRINT" />

              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />

              <queries>
                  <package android:name="com.whatsapp" />
                  <package android:name="com.whatsapp.w4b" />
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="http" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme"
                  tools:overrideLibrary="com.getcapacitor.android">

                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:name="io.github.karamegy.Ton2.MainActivity"
                      android:label="@string/title_activity_main"
                      android:theme="@style/AppTheme.NoActionBarLaunch"
                      android:launchMode="singleTask"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="karamegy.github.io" android:pathPrefix="/Ton2" />
                          <data android:scheme="https" android:host="giti-68750.firebaseapp.com" />
                      </intent-filter>
                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>

              </application>

          </manifest>
          EOF

          # 7. حقن النصوص وقيم المعرفات في strings.xml
          mkdir -p android/app/src/main/res/values/
          cat << 'EOF' > android/app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Giti ERP</string>
              <string name="title_activity_main">Giti فواتير</string>
              <string name="package_name">io.github.karamegy.Ton2</string>
              <string name="custom_url_scheme">io.github.karamegy.Ton2</string>
              <string name="server_client_id">753885709520-r09nngge8556ndmg0ampdu266iota0lv.apps.googleusercontent.com</string>
              <string name="default_web_client_id">753885709520-r09nngge8556ndmg0ampdu266iota0lv.apps.googleusercontent.com</string>
              <string name="file_provider_authority">io.github.karamegy.Ton2.fileprovider</string>
          </resources>
          EOF

          # 8. إعداد مسارات المشاركة والحفظ للملفات والـ PDF
          mkdir -p android/app/src/main/res/xml
          cat << 'EOF' > android/app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-path name="external_files" path="." />
              <cache-path name="cache_files" path="." />
              <files-path name="internal_files" path="." />
          </paths>
          EOF

          # 9. نسخ ملف التوقيع إن وجد
          if [ -f "signing.keystore" ]; then
            cp signing.keystore android/app/
          fi

          # 10. مزامنة المشروع مع أندرويد
          npx cap sync android

          # 11. حقن إعدادات التوقيع والإصدار المعتمد في android/app/build.gradle
          node -e '
            const fs = require("fs");
            let appGradle = fs.readFileSync("android/app/build.gradle", "utf8");

            // تحديث targetSdkVersion إلى المستقر 34
            appGradle = appGradle.replace(/targetSdkVersion\s+\d+/, "targetSdkVersion 34");

            const signingConfigStr = `
                signingConfigs {
                    release {
                        if (file("signing.keystore").exists()) {
                            storeFile file("signing.keystore")
                            storePassword "${process.env.KEYSTORE_PASSWORD}"
                            keyAlias "${process.env.KEY_ALIAS}"
                            keyPassword "${process.env.KEY_PASSWORD}"
                            v1SigningEnabled true
                            v2SigningEnabled true
                        }
                    }
                }
            `;

            appGradle = appGradle.replace(/android\s*\{/, "android {\n" + signingConfigStr);
            appGradle = appGradle.replace(/buildTypes\s*\{[\s\S]*?release\s*\{/, match => match + "\n            signingConfig signingConfigs.release");

            if (fs.existsSync("android/app/google-services.json")) {
              if (!appGradle.includes("com.google.gms.google-services")) {
                appGradle += "\napply plugin: \"com.google.gms.google-services\"\n";
              }
            }

            fs.writeFileSync("android/app/build.gradle", appGradle);
          '

          # 12. بناء التطبيق وحزم APK و AAB
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
          ./gradlew assembleRelease --no-daemon

      - name: Upload AAB Bundle Artifact (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: giti-erp-release-bundle
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload APK Artifact (Direct Install)
        uses: actions/upload-artifact@v4
        with:
          name: giti-erp-installable-apk
          path: android/app/build/outputs/apk/release/*.apk
