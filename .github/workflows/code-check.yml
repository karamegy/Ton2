name: Code Quality Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Verify Core Files Exist
        run: |
          if [ ! -f "index.html" ]; then echo "Error: index.html missing"; exit 1; fi
          if [ ! -f "app.js" ]; then echo "Error: app.js missing"; exit 1; fi
          if [ ! -f "capacitor.config.json" ]; then echo "Error: capacitor.config.json missing"; exit 1; fi
          echo "All core files verified successfully!"
