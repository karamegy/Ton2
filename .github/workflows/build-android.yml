name: Build GITI ERP Android App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Clean Environment and Generate Android Project
        run: |
          npm install

          # 1. تهيئة مجلد www وتحديث ملف التكوين لتثبيت اسم الحزمة com.giti.erp.ton2 والـ webDir
          mkdir -p www
          cp -r * www/ 2>/dev/null || true
          
          node -e '
            const fs = require("fs");
            let cfg = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            cfg.webDir = "www";
            cfg.appId = "com.giti.erp.ton2";
            cfg.appName = "Ton2 ERP";
            fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
          '

          # 2. مسح مجلد أندرويد لإجبار الكاباسيتور على توليد مشروع جديد ونظيف
          rm -rf android

          # 3. إنشاء منصة أندرويد المربوطة بالحزمة المعتمدة
          npx @capacitor/cli add android
          
          # 4. إنشاء مسار الجافا وملف MainActivity
          mkdir -p android/app/src/main/java/com/giti/erp/ton2
          cat << 'EOF' > android/app/src/main/java/com/giti/erp/ton2/MainActivity.java
          package com.giti.erp.ton2;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {}
          EOF

          # 5. مزامنة المشروع
          npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android App (AAB & APK)
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
          ./gradlew assembleDebug

      - name: Upload AAB Bundle Artifact (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: giti-erp-release-bundle
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload APK Artifact (Direct Install)
        uses: actions/upload-artifact@v4
        with:
          name: giti-erp-installable-apk
          path: android/app/build/outputs/apk/debug/*.apk
