name: Build GITI ERP Android App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android App Safely
        run: |
          # 1. إعداد مجلد الويب وتحديث ملف التكوين
          mkdir -p www
          cp -r * www/ 2>/dev/null || true
          
          node -e '
            const fs = require("fs");
            let cfg = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            cfg.webDir = "www";
            cfg.appId = "io.github.karamegy.Ton2";
            cfg.appName = "Ton2 ERP";
            fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
          '

          # 2. إنشاء مشروع أندرويد نظيف
          npx @capacitor/cli init "Ton2 ERP" "io.github.karamegy.Ton2" --web-dir www || true
          npx @capacitor/cli add android || true

          # 3. إنشاء مسار الجافا الصحيح
          mkdir -p android/app/src/main/java/io/github/karamegy/Ton2
          cat << 'EOF' > android/app/src/main/java/io/github/karamegy/Ton2/MainActivity.java
          package io.github.karamegy.Ton2;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {}
          EOF

          # 4. نسخ مفتاح التوقيع
          cp signing.keystore android/app/ || true

          # 5. ضبط إعدادات الـ build.gradle بقوة وثبات على المستوى 34 والتوقيع
          cat << 'EOF' >> android/app/build.gradle

          android {
              compileSdk 34
              defaultConfig {
                  applicationId "io.github.karamegy.Ton2"
                  minSdk 22
                  targetSdk 34
              }
              signingConfigs {
                  release {
                      storeFile file('signing.keystore')
                      storePassword 'Gamef90IIwmB'
                      keyAlias 'my-key-alias'
                      keyPassword 'Gamef90IIwmB'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF

          # 6. مزامنة وبناء الحزمة
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
          ./gradlew assembleDebug --no-daemon

      - name: Upload AAB Bundle Artifact (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: giti-erp-release-bundle
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload APK Artifact (Direct Install)
        uses: actions/upload-artifact@v4
        with:
          name: giti-erp-installable-apk
          path: android/app/build/outputs/apk/debug/*.apk
