<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الممالك والاستراتيجية - Lords Mobile Hub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .hub-container {
            text-align: center;
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
        }
        .hub-logo {
            font-size: 3.5em;
            color: var(--gold);
            margin-bottom: 10px;
            text-shadow: 0 0 20px var(--gold-glow);
        }
        .hub-desc {
            color: #bdc3c7;
            margin-bottom: 30px;
            font-size: 1.1em;
            line-height: 1.5;
        }
        .hub-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 15px 0;
            font-size: 1.2em;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            box-sizing: border-box;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .hub-btn:hover {
            transform: translateY(-3px);
        }
        .btn-gameplay {
            background: linear-gradient(135deg, #d35400, #b9770e);
            color: white;
            box-shadow: 0 5px 15px rgba(211, 84, 0, 0.4);
        }
        .btn-management {
            background: linear-gradient(135deg, #c0392b, #641e16);
            color: white;
            box-shadow: 0 5px 15px rgba(192, 57, 43, 0.4);
        }
    </style>
</head>
<body>

    <div class="lords-empire-container hub-container">
        <div class="hub-logo">🏰 بوابة الممالك</div>
        <p class="hub-desc">مرحباً بك أيها القائد الإمبراطوري. اختر وجهتك لإدارة شؤون الحرب أو الدخول للوحة التحكم السحابية.</p>

        <a href="index.html" class="hub-btn btn-gameplay">⚔️ دخول ساحة اللعبة والإمبراطورية</a>
        <a href="admin.html" class="hub-btn btn-management">🛡️ الانتقال إلى لوحة الإدارة وسيرفر اللعبة</a>
    </div>

</body>
</html>
