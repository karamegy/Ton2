name: Build GITI ERP Android App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Android App
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 1. إعداد مجلد الويب وتحديث ملف التكوين
          mkdir -p www
          cp -r * www/ 2>/dev/null || true
          
          node -e '
            const fs = require("fs");
            let cfg = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            cfg.webDir = "www";
            cfg.appId = "io.github.karamegy.Ton2";
            cfg.appName = "GITI ERP";
            cfg.plugins = cfg.plugins || {};
            cfg.plugins.GoogleAuth = {
              scopes: ["profile", "email"],
              serverClientId: "753885709520-r09nngge8556ndmg0ampdu266iota0lv.apps.googleusercontent.com",
              forceCodeForRefreshToken: true
            };
            fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
          '

          # 2. تثبيت أدوات الكاباسيتور الأساسية ومكتبات المشاركة والتخزين والأيقونات
          npm install @capacitor/cli @capacitor/core @capacitor/filesystem @capacitor/share @codetrix-studio/capacitor-google-auth @capacitor/assets --save-dev

          # 3. إعادة إنشاء منصة أندرويد نظيفة
          rm -rf android
          npx cap add android

          # 4. تجهيز الأيقونة وتوليد أحجام mipmap لأندرويد
          mkdir -p assets
          cp logo.png assets/icon-only.png 2>/dev/null || cp logo.png assets/icon.png
          cp logo.png assets/icon.png
          npx @capacitor/assets generate --android

          # 5. نسخ ملف google-services.json إلى مشروع الأندرويد إذا وجد
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/
          fi

          # 6. تجهيز مسارات موفر الملفات والـ AndroidManifest
          mkdir -p android/app/src/main/res/xml/
          cat << 'EOF' > android/app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-path name="external_files" path="." />
              <cache-path name="cache_files" path="." />
              <files-path name="files_path" path="." />
          </paths>
          EOF

          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools"
              package="io.github.karamegy.Ton2">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />
              <uses-permission android:name="android.permission.USE_FINGERPRINT" />

              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />

              <queries>
                  <package android:name="com.whatsapp" />
                  <package android:name="com.whatsapp.w4b" />
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="http" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme"
                  tools:overrideLibrary="com.getcapacitor.android">

                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:name="io.github.karamegy.Ton2.MainActivity"
                      android:label="@string/title_activity_main"
                      android:theme="@style/AppTheme.NoActionBarLaunch"
                      android:launchMode="singleTask"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="karamegy.github.io" android:pathPrefix="/Ton2" />
                          <data android:scheme="https" android:host="giti-68750.firebaseapp.com" />
                      </intent-filter>
                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="io.github.karamegy.Ton2.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>

              </application>

          </manifest>
          EOF

          # 7. حقن ملف strings.xml
          mkdir -p android/app/src/main/res/values/
          cat << 'EOF' > android/app/src/main/res/values/strings.xml
          <?xml version='1.0' encoding='utf-8'?>
          <resources>
              <string name="app_name">GITI ERP</string>
              <string name="title_activity_main">GITI ERP</string>
              <string name="package_name">io.github.karamegy.Ton2</string>
              <string name="custom_url_scheme">io.github.karamegy.Ton2</string>
              <string name="server_client_id">753885709520-r09nngge8556ndmg0ampdu266iota0lv.apps.googleusercontent.com</string>
              <string name="default_web_client_id">753885709520-r09nngge8556ndmg0ampdu266iota0lv.apps.googleusercontent.com</string>
              <string name="file_provider_authority">io.github.karamegy.Ton2.fileprovider</string>
          </resources>
          EOF

          # 8. نسخ ملف التوقيع
          if [ -f "signing.keystore" ]; then
            cp signing.keystore android/app/
          fi
                    # إنشاء ملف قواعد ProGuard وحقنها تلقائياً قبل البناء
          cat << 'EOF' > android/app/proguard-rules.pro
          # قواعد عامة لـ Capacitor والمكتبات التابعة
          -keep public class * extends android.webkit.WebViewClient
          -keep public class * extends android.webkit.WebChromeClient

          # الحفاظ على إعدادات Google Play Services و Firebase
          -keep class com.google.android.gms.** { *; }
          -include proguard-google-play-services.pro

          # الحفاظ على موديولات Capacitor الأساسية
          -keep class com.getcapacitor.** { *; }
          -dontwarn com.getcapacitor.**

          # الحفاظ على إعدادات تسجيل الدخول بـ Google
          -keep class com.codetrixstudio.capacitor.googleauth.** { *; }
          -dontwarn com.codetrixstudio.capacitor.googleauth.**

          # الحفاظ على النماذج والكلاسات الخاصة بتطبيقك
          -keep class io.github.karamegy.Ton2.** { *; }
          EOF


          # 9. إعداد Gradle للتوقيع وضبط إصدار الجافا لـ 21 وتحديد رقم الإصدار الجديد
          cat << EOF >> android/app/build.gradle

          android {
              defaultConfig {
                  applicationId "io.github.karamegy.Ton2"
                  minSdk 24
                  targetSdk 36
                  versionCode 80013
                  versionName "8.0.1.3"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_21
                  targetCompatibility JavaVersion.VERSION_21
              }
              signingConfigs {
                  release {
                      storeFile file('signing.keystore')
                      storePassword '$KEYSTORE_PASSWORD'
                      keyAlias '$KEY_ALIAS'
                      keyPassword '$KEY_PASSWORD'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled true                      
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

                  }
              }
          }
          EOF

          # 10. المزامنة والبناء
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
          ./gradlew assembleRelease --no-daemon

      - name: Upload AAB Bundle Artifact (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: giti-erp-release-bundle
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload APK Artifact (Direct Install)
        uses: actions/upload-artifact@v4
        with:
          name: giti-erp-installable-apk
          path: android/app/build/outputs/apk/release/*.apk
