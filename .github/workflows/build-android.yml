name: Build GITI ERP Android App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create and Restore Java Native Structure
        run: |
          npm install
          
          # تصحيح مشكلة webDir في ملف التكوين
          node -e '
            const fs = require("fs");
            const config = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            if (config.webDir === ".") {
              config.webDir = "www";
            }
            fs.writeFileSync("capacitor.config.json", JSON.stringify(config, null, 2));
          ' || true

          # إنشاء مسار الجافا المطلوبة لمشروع Ton2 وإعداد MainActivity وإعادتها للمشروع
          mkdir -p android/app/src/main/java/com/giti/erp/ton2
          cat << 'EOF' > android/app/src/main/java/com/giti/erp/ton2/MainActivity.java
          package com.giti.erp.ton2;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {}
          EOF

          npx cap sync android

      - name: Commit and Push Generated Java Files to Repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-generate Android native Java structure for Ton2 [skip ci]"
          branch: main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android App (AAB & APK)
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
          ./gradlew assembleRelease

      - name: Upload AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: giti-erp-release-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: giti-erp-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
