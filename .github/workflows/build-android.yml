name: Build GITI ERP Android App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Complete Android Environment
        run: |
          npm install
          
          # ضبط ملف التكوين ليتوافق مع بناء الـ APK و AAB
          node -e '
            const fs = require("fs");
            const config = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            if (config.webDir === ".") {
              config.webDir = "www";
            }
            fs.writeFileSync("capacitor.config.json", JSON.stringify(config, null, 2));
          ' || true

          # إنشاء مجلد www محلياً لضمان عدم وجود أخطاء في الـ sync
          mkdir -p www
          cp index.html www/ 2>/dev/null || true

          # توليد منصة الأندرويد وملفات الـ Gradle بالكامل على السيرفر
          npx @capacitor/cli add android || true
          npx cap sync android || true

          # التأكد من وجود ملف MainActivity في مكانه الصحيح
          mkdir -p android/app/src/main/java/com/giti/erp/ton2
          if [ ! -f android/app/src/main/java/com/giti/erp/ton2/MainActivity.java ]; then
            cat << 'EOF' > android/app/src/main/java/com/giti/erp/ton2/MainActivity.java
            package com.giti.erp.ton2;

            import android.os.Bundle;
            import com.getcapacitor.BridgeActivity;

            public class MainActivity extends BridgeActivity {}
            EOF
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android App (AAB & APK)
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
          ./gradlew assembleRelease

      - name: Upload AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: giti-erp-release-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: giti-erp-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
