<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090d16">
  <title>GITI - مساعد الذكاء الاصطناعي الذكي</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #090d16;
      color: #fff;
      font-family: 'Cairo', sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .bot-header {
      padding: 12px 16px;
      background: rgba(17, 24, 39, 0.9);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(10px);
      gap: 8px;
    }
    .bot-header h1 {
      font-size: 0.95rem;
      margin: 0;
      background: linear-gradient(135deg, #3b82f6, #10b981);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-tools {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: 12px;
      overflow: hidden;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 88%;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 0.9rem;
      line-height: 1.5;
      word-wrap: break-word;
    }
    .message.user {
      background: #3b82f6;
      color: #fff;
      align-self: flex-end;
      border-bottom-left-radius: 4px;
    }
    .message.bot {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #f3f4f6;
      align-self: flex-start;
      border-bottom-right-radius: 4px;
    }
    /* الأزرار المقترحة السريعة */
    .quick-chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 6px 4px;
      margin-bottom: 8px;
      scrollbar-width: none;
    }
    .quick-chips::-webkit-scrollbar { display: none; }
    .chip {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #60a5fa;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .chip:hover {
      background: #3b82f6;
      color: #fff;
    }
    .chat-input-area {
      padding: 10px;
      background: rgba(17, 24, 39, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .chat-input-area input {
      flex: 1;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #fff;
      font-family: 'Cairo', sans-serif;
      outline: none;
      font-size: 0.88rem;
    }
    .chat-input-area input:focus {
      border-color: #3b82f6;
    }
    .btn-action {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.85rem;
    }
    .btn-mic {
      background: #ef4444;
    }
    .btn-tool {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.75rem;
    }
    .btn-tool:hover { background: rgba(255,255,255,0.15); }
  </style>
</head>
<body>

  <header class="bot-header">
    <button class="btn-tool" onclick="window.location.href='index.html'">← النظام</button>
    <h1>🤖 مساعد GITI الذكي</h1>
    <div class="header-tools">
      <button id="voice-toggle-btn" class="btn-tool" title="كتم/تفعيل الصوت">🔊</button>
      <button id="clear-chat-btn" class="btn-tool" title="مسح المحادثة">🗑️</button>
    </div>
  </header>

  <div class="chat-container">
    <div id="chat-messages" class="chat-messages">
      <div class="message bot">
        أهلاً بك يا فندم! أنا مساعدك الذكي المرتبط بحسابك. يمكنك استخدام الأزرار السريعة بالأسفل أو سؤالي مباشرة مثل:<br>
        • "كشف حساب [اسم العميل]"<br>
        • "فاتورة رقم [1001]"<br>
        • "إجمالي المبيعات" | "المخزن" | "المصروفات"
      </div>
    </div>

    <!-- الأزرار المقترحة السريعة -->
    <div class="quick-chips">
      <button class="chip" onclick="sendPresetCommand('إجمالي المبيعات')">💰 إجمالي المبيعات</button>
      <button class="chip" onclick="sendPresetCommand('قائمة المخزن')">📦 المخزن والمنتجات</button>
      <button class="chip" onclick="sendPresetCommand('سجل المصروفات')">💸 المصروفات</button>
      <button class="chip" onclick="sendPresetCommand('قائمة العملاء')">👥 العملاء</button>
    </div>

    <div class="chat-input-area">
      <button type="button" id="mic-btn" class="btn-action btn-mic" title="تحدث صوتياً">🎙️</button>
      <input type="text" id="user-input" placeholder="اكتب أمرك هنا..." autocomplete="off">
      <button type="button" id="send-btn" class="btn-action">إرسال ➔</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDqFZjs7m93mB5XsnO_bAQV49O7g2FQkZc",
      authDomain: "giti-68750.firebaseapp.com",
      projectId: "giti-68750",
      storageBucket: "giti-68750.firebasestorage.app",
      messagingSenderId: "753885709520",
      appId: "1:753885709520:web:eda57cd4efdb5c4ef48ad5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let invoicesDB = [];
    let clientsDB = [];
    let productsDB = [];
    let expensesDB = [];
    let storeProfile = { currency: 'ج.م', name: 'GITI ERP' };
    let isVoiceMuted = false;

    function getLocalData(uid, key, fallback = []) {
      try {
        const data = localStorage.getItem(`giti_${uid}_${key}`);
        return data ? JSON.parse(data) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        
        // 1. تحميل البيانات من الذاكرة المحلية فوراً (لكي يعمل البوت بدون إنترنت وبسرعة فائقة دون تجمد)
        invoicesDB = getLocalData(user.uid, 'invoices', []);
        clientsDB = getLocalData(user.uid, 'clients', []);
        productsDB = getLocalData(user.uid, 'products', []);
        expensesDB = getLocalData(user.uid, 'expenses', []);
        const prof = getLocalData(user.uid, 'profile', null);
        if (prof) storeProfile = Object.assign({}, storeProfile, prof);

        // 2. محاولة التحديث من فايبربيس في الخلفية بصمت (إن وجد إنترنت)
        try {
          const invSnap = await getDocs(collection(db, "users", user.uid, "invoices"));
          if (!invSnap.empty) { invoicesDB = []; invSnap.forEach(d => invoicesDB.push(d.data())); }
          
          const clientSnap = await getDocs(collection(db, "users", user.uid, "clients"));
          if (!clientSnap.empty) { clientsDB = []; clientSnap.forEach(d => clientsDB.push(d.data())); }
          
          const prodSnap = await getDocs(collection(db, "users", user.uid, "products"));
          if (!prodSnap.empty) { productsDB = []; prodSnap.forEach(d => productsDB.push(d.data())); }
          
          const expSnap = await getDocs(collection(db, "users", user.uid, "expenses"));
          if (!expSnap.empty) { expensesDB = []; expSnap.forEach(d => expensesDB.push(d.data())); }
        } catch (e) {
          console.log("وضع العمل بدون إنترنت (Offline Mode) نشط، يتم الاعتماد على البيانات المحلية.");
        }
      } else {
        alert('يرجى تسجيل الدخول من التطبيق الرئيسي أولاً.');
        window.location.replace('index.html');
      }
    });

    const chatMessages = document.getElementById('chat-messages');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const micBtn = document.getElementById('mic-btn');
    const voiceToggleBtn = document.getElementById('voice-toggle-btn');
    const clearChatBtn = document.getElementById('clear-chat-btn');

    voiceToggleBtn.addEventListener('click', () => {
      isVoiceMuted = !isVoiceMuted;
      voiceToggleBtn.textContent = isVoiceMuted ? '🔇' : '🔊';
      voiceToggleBtn.style.opacity = isVoiceMuted ? '0.5' : '1';
    });

    clearChatBtn.addEventListener('click', () => {
      chatMessages.innerHTML = `
        <div class="message bot">تم مسح المحادثة. كيف يمكنني مساعدتك الآن؟</div>
      `;
    });

    window.sendPresetCommand = (cmdText) => {
      processCommand(cmdText);
    };

    function appendMessage(text, sender) {
      const div = document.createElement('div');
      div.className = `message ${sender}`;
      div.innerHTML = text.replace(/\n/g, '<br>');
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function speakText(text) {
      if (isVoiceMuted) return;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ar-SA';
        window.speechSynthesis.speak(utterance);
      }
    }

    function processCommand(rawText) {
      const text = rawText.trim().toLowerCase();
      appendMessage(rawText, 'user');
      userInput.value = '';

      let reply = "عذراً، لم أفهم طلبك بدقة. يمكنك طلب كشف حساب عميل، أو رقم فاتورة، أو حالة المخزن والمصروفات.";

      // 1. الفواتير
      if (text.includes('فاتورة') || text.includes('رقم')) {
        const matches = text.match(/\d+/);
        if (matches) {
          const invId = parseInt(matches[0]);
          const inv = invoicesDB.find(i => i.id === invId);
          if (inv) {
            reply = `🧾 تفاصيل الفاتورة #${inv.id}:\n• العميل: ${inv.client}\n• التاريخ: ${inv.date}\n• الحالة: ${inv.status}\n• الإجمالي: ${inv.grandTotal.toFixed(2)} ${storeProfile.currency}`;
          } else {
            reply = `❌ لم يتم العثور على فاتورة برقم ${invId} في حسابك.`;
          }
        }
      } 
      // 2. كشف حساب عميل
      else if (text.includes('حساب') || text.includes('كشف')) {
        let query = text.replace('كشف حساب', '').replace('حساب', '').trim();
        if (query) {
          const client = clientsDB.find(c => c.name.toLowerCase().includes(query));
          if (client) {
            const clientInvoices = invoicesDB.filter(i => (i.clientId === client.id) || (i.client && i.client.toLowerCase() === client.name.toLowerCase()));
            let totalPurchases = client.openingBalance || 0;
            let totalPaid = 0;
            clientInvoices.forEach(inv => {
              totalPurchases += (inv.grandTotal || 0);
              totalPaid += (inv.paidAmount || 0);
            });
            (client.payments || []).forEach(p => totalPaid += (p.amount || 0));
            const balance = Math.max(0, totalPurchases - totalPaid);

            reply = `👤 كشف حساب العميل: ${client.name}\n• إجمالي التعاملات: ${totalPurchases.toFixed(2)} ${storeProfile.currency}\n• المدفوع: ${totalPaid.toFixed(2)} ${storeProfile.currency}\n• المديونية المستحقة: ${balance.toFixed(2)} ${storeProfile.currency}`;
          } else {
            reply = `❌ لم أجد عميلاً بهذا الاسم في دفاترك.`;
          }
        } else {
          reply = `يرجى تحديد اسم العميل بجانب كلمة كشف حساب.`;
        }
      } 
      // 3. إجمالي المبيعات
      else if (text.includes('مبيعات') || text.includes('إجمالي')) {
        const total = invoicesDB.reduce((acc, i) => acc + (i.grandTotal || 0), 0);
        reply = `💰 إجمالي مبيعاتك المسجلة: ${total.toFixed(2)} ${storeProfile.currency} (${invoicesDB.length} فاتورة).`;
      }
      // 4. المخزن والمنتجات
      else if (text.includes('مخزن') || text.includes('منتجات')) {
        if (productsDB.length === 0) {
          reply = `📦 المخزن لديك فارغ حالياً ولا توجد منتجات مسجلة.`;
        } else {
          let prodList = productsDB.map(p => `• ${p.name} (السعر: ${p.price} ${storeProfile.currency} - المخزون: ${p.stock})`).join('\n');
          reply = `📦 قائمة المنتجات بالمخزن (${productsDB.length} أصناف):\n${prodList}`;
        }
      }
      // 5. المصروفات
      else if (text.includes('مصروفات') || text.includes('مصروف')) {
        const totalExp = expensesDB.reduce((acc, e) => acc + (e.amount || 0), 0);
        reply = `💸 إجمالي المصروفات المسجلة: ${totalExp.toFixed(2)} ${storeProfile.currency} (${expensesDB.length} بند مصروف).`;
      }
      // 6. قائمة العملاء
      else if (text.includes('العملاء') || text.includes('عملاء')) {
        if (clientsDB.length === 0) {
          reply = `👥 لا توجد عملاء مسجلون لديك حتى الآن.`;
        } else {
          let clientNames = clientsDB.map(c => `• ${c.name} (${c.phone || 'بدون هاتف'})`).join('\n');
          reply = `👥 قائمة العملاء المسجلين (${clientsDB.length} عميل):\n${clientNames}`;
        }
      }

      setTimeout(() => {
        appendMessage(reply, 'bot');
        speakText(reply);
      }, 300);
    }

    sendBtn.addEventListener('click', () => {
      if (userInput.value.trim()) processCommand(userInput.value);
    });

    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && userInput.value.trim()) processCommand(userInput.value);
    });

    // التعرف الصوتي
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      recognition.lang = 'ar-EG';
      recognition.continuous = false;

      micBtn.addEventListener('click', () => {
        try {
          recognition.start();
          micBtn.style.background = '#10b981';
          micBtn.textContent = '👂';
        } catch(e) {
          console.error(e);
        }
      });

      recognition.onresult = (event) => {
        const speechResult = event.results[0][0].transcript;
        micBtn.style.background = '#ef4444';
        micBtn.textContent = '🎙️';
        processCommand(speechResult);
      };

      recognition.onerror = () => {
        micBtn.style.background = '#ef4444';
        micBtn.textContent = '🎙️';
      };

      recognition.onend = () => {
        micBtn.style.background = '#ef4444';
        micBtn.textContent = '🎙️';
      };
    } else {
      micBtn.style.display = 'none';
    }
  </script>
</body>
</html>
