name: Build GITI ERP Android App

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'capacitor.config.json'
      - 'signing.keystore'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

     steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android App
        run: |
          # 1. إعداد مجلد الويب وتحديث ملف التكوين لتثبيت اسم الحزمة وإعدادات GoogleAuth
          mkdir -p www
          cp -r * www/ 2>/dev/null || true
          
          node -e '
            const fs = require("fs");
            let cfg = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            cfg.webDir = "www";
            cfg.appId = "io.github.karamegy.Ton2";
            cfg.appName = "Ton2 ERP";
            cfg.plugins = cfg.plugins || {};
            cfg.plugins.GoogleAuth = {
              scopes: ["profile", "email"],
              serverClientId: "753885709520-web.apps.googleusercontent.com",
              forceCodeForRefreshToken: true
            };
            fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
          '

          # 2. تثبيت أدوات الكاباسيتور الأساسية ومكتبة Google Auth
          npm install @capacitor/cli @capacitor/core @codetrix-studio/capacitor-google-auth --save

          # 3. إعادة إنشاء منصة أندرويد نظيفة
          rm -rf android
          npx cap add android

          # 4. تحديث ملف AndroidManifest.xml بالأذونات وواجهات النماذج المطلوبة
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />
              <uses-permission android:name="android.permission.USE_FINGERPRINT" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  tools:overrideLibrary="com.getcapacitor.android">

                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:name="io.github.karamegy.Ton2.MainActivity"
                      android:label="@string/title_activity_main"
                      android:theme="@style/AppTheme.NoActionBarLaunch"
                      android:launchMode="singleTask"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="karamegy.github.io" android:pathPrefix="/Ton2" />
                          <data android:scheme="https" android:host="giti-68750.firebaseapp.com" />
                      </intent-filter>
                  </activity>

              </application>

          </manifest>
          EOF

          # 5. حقن ملف strings.xml مع معرف Google Login
          mkdir -p android/app/src/main/res/values/
          cat << 'EOF' > android/app/src/main/res/values/strings.xml
          <?xml version='1.0' encoding='utf-8'?>
          <resources>
              <string name="app_name">Ton2 ERP</string>
              <string name="title_activity_main">Ton2 ERP</string>
              <string name="package_name">io.github.karamegy.Ton2</string>
              <string name="custom_url_scheme">io.github.karamegy.Ton2</string>
              <string name="server_client_id">753885709520-web.apps.googleusercontent.com</string>
          </resources>
          EOF

          # 6. نسخ ملف التوقيع الحقيقي
          cp signing.keystore android/app/ || true

          # 7. حقن إعدادات بناء الـ Gradle وتكوين الإصدار ورقم البناء التلقائي
          cat << 'EOF' >> android/app/build.gradle

          android {
              defaultConfig {
                  applicationId "io.github.karamegy.Ton2"
                  minSdk 23
                  targetSdk 34
                  versionCode ${{ github.run_number }}
                  versionName "1.0.${{ github.run_number }}"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              signingConfigs {
                  release {
                      storeFile file('signing.keystore')
                      storePassword 'Gamef90IIwmB'
                      keyAlias 'my-key-alias'
                      keyPassword 'Gamef90IIwmB'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF

          # 8. مزامنة المشروع وبناء الـ AAB والـ APK
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
          ./gradlew assembleRelease --no-daemon

      - name: Upload AAB Bundle Artifact (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: giti-erp-release-bundle
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload APK Artifact (Direct Install)
        uses: actions/upload-artifact@v4
        with:
          name: giti-erp-installable-apk
          path: android/app/build/outputs/apk/release/*.apk
