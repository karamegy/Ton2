name: Build GITI ERP Android App

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android App
        run: |
          # 1. تنظيف وإعداد مجلد الويب وتحديث ملف التكوين لتثبيت اسم الحزمة وإعدادات GoogleAuth
          rm -rf www
          mkdir -p www
          find . -maxdepth 1 ! -name '.' ! -name 'www' ! -name 'android' ! -name 'node_modules' ! -name '.git' -exec cp -r {} www/ \; 2>/dev/null || true
          
          node -e '
            const fs = require("fs");
            let cfg = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            cfg.webDir = "www";
            cfg.appId = "io.github.karamegy.Ton2";
            cfg.appName = "Ton2 ERP";
            cfg.plugins = cfg.plugins || {};
            cfg.plugins.GoogleAuth = {
              scopes: ["profile", "email"],
              serverClientId: "753885709520-web.apps.googleusercontent.com",
              forceCodeForRefreshToken: true
            };
            fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
          '

          # 2. تثبيت أدوات الكاباسيتور الأساسية ومكتبة Google Auth
          npm install @capacitor/cli @capacitor/core @codetrix-studio/capacitor-google-auth --save

          # 3. التحقق من وجود مجلد أندرويد وإضافته بلطف للحفاظ على الثبات
          if [ ! -d "android" ]; then
            npx cap add android
          fi

          # 4. نسخ ملف التوقيع الحقيقي لضمان ثبات مفتاح التوقيع
          cp signing.keystore android/app/ || true

          # 5. حقن إعدادات بناء الـ Gradle وتكوين الإصدار ورقم البناء التلقائي
          cat << 'EOF' >> android/app/build.gradle

          android {
              defaultConfig {
                  applicationId "io.github.karamegy.Ton2"
                  minSdk 23
                  targetSdk 34
                  versionCode ${{ github.run_number }}
                  versionName "1.0.${{ github.run_number }}"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              signingConfigs {
                  release {
                      storeFile file('signing.keystore')
                      storePassword 'Gamef90IIwmB'
                      keyAlias 'my-key-alias'
                      keyPassword 'Gamef90IIwmB'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF

          # 6. مزامنة المشروع وبناء الـ AAB والـ APK بنمط ثابت مستقر
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
          ./gradlew assembleRelease --no-daemon

      - name: Upload AAB Bundle Artifact (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: giti-erp-release-bundle
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload APK Artifact (Direct Install)
        uses: actions/upload-artifact@v4
        with:
          name: giti-erp-installable-apk
          path: android/app/build/outputs/apk/release/*.apk
